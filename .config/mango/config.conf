# More option see https://github.com/DreamMaoMao/mango/wiki/

# Auto reload config
auto_reload_config=1

# Matugen
source=~/.config/mango/colors.conf

# Autostart
exec_once=waybar
exec_once=awww-daemon
exec_once=bash ~/.config/mango/autostart.sh
exec_once= udiskie
exec_once=sh -c "sleep 2 && wlsunset -l 18.7 -L 98.8"
exec_once=nm-applet
# Env vars
env=__GLX_VENDOR_LIBRARY_NAME,nvidia
env=EDITOR,nvim
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=LIBVA_DRIVER_NAME,nvidia
env=MANPAGER,nvim +Man!
env=NVD_BACKEND,direct
env=QT_QPA_PLATFORMTHEME,qt6ct
env=WLR_SCENE_DISABLE_DIRECT_SCANOUT,1

# Monitors
monitor_rule=name:^HDMI-A-1$,width:1920,height:1080,refresh:75,x:0,y:0
monitor_rule=name:^DP-1$,width:1920,height:1080,refresh:240,x:1920,y:0,primary:1,vrr:0
allow_tearing=2

# Window effect
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 12
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 1
layer_shadows = 1
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color= 0x000000ff

border_radius=12
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_master_factor=0.55
default_master_count=1
tag_num=9
smart_gaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
overview_gap_inner=5
overview_gap_outer=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_theme=Adwaita
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us,th
xkb_rules_variant=graphite,
xkb_rules_options=grp:win_space_toggle

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
# these might be depracated
# disable_while_typing=1
# left_handed=0
# middle_button_emulation=0
swipe_min_threshold=1

# Mouse
# need relogin to make it apply
mouse_natural_scrolling=0
mouse_accel_profile=0

# Appearance
gap_inner_horizontal=7
gap_inner_vertical=7
gap_outer_horizontal=10
gap_outer_vertical=8
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=3

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule=id:1,layout_name:fair
tag_rule=id:2,layout_name:fair
tag_rule=id:3,layout_name:fair
tag_rule=id:4,layout_name:fair
tag_rule=id:5,layout_name:fair
tag_rule=id:6,layout_name:fair
tag_rule=id:7,layout_name:fair
tag_rule=id:8,layout_name:fair
tag_rule=id:9,layout_name:fair

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# Wallpaper picker
bind=CTRL+Alt,w,spawn,~/scripts/wall-picker.sh
# hyprpicker
bind=SUPER+SHIFT,c,spawn,hyprpicker
# browser
bind=Alt,q,spawn,helium-browser
# file manager
bind=Alt,e,spawn_shell,kitty yazi

# reload config
bind=SUPER+SHIFT,r,reload_config

# reload waybar
bind=SUPER+SHIFT,b,spawn_shell,killall -SIGUSR2 waybar

# screenshot
bind=NONE,Print,spawn_shell, wayfreeze --after-freeze-cmd 'grim -g "$(slurp)" - | wl-copy; killall wayfreeze'

# menu and terminal
bind=Alt,space,spawn,rofi -show drun
bind=Alt,Return,spawn,kitty

# exit
bind=SUPER+SHIFT,m,quit
bind=ALT,b,killclient,

# switch window focus
bind=SUPER,Tab,focusstack,next
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down
bind=ALT,h,focusdir,left
bind=ALT,j,focusdir,down
bind=ALT,k,focusdir,up
bind=ALT,l,focusdir,right

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,equibop
bind=ALT,Tab,togglejump,
bind=ALT,v,togglefloating,
bind=ALT,m,togglemaximizescreen,
bind=ALT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout
# bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout
# bind=SUPER,n,switch_layout

# tag switch
bind=SUPER,Left,viewtoleft,0
# bind=CTRL,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
# bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=Alt,1,view,1,0
bind=Alt,2,view,2,0
bind=Alt,3,view,3,0
bind=Alt,4,view,4,0
bind=Alt,5,view,5,0
bind=Alt,6,view,6,0
bind=Alt,7,view,7,0
bind=Alt,8,view,8,0
bind=Alt,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=shift+Alt,1,tag,1,0
bind=shift+Alt,2,tag,2,0
bind=shift+Alt,3,tag,3,0
bind=shift+Alt,4,tag,4,0
bind=shift+Alt,5,tag,5,0
bind=shift+Alt,6,tag,6,0
bind=shift+Alt,7,tag,7,0
bind=shift+Alt,8,tag,8,0
bind=shift+Alt,9,tag,9,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=alt+shift,h,focusmon,left
bind=alt+shift,l,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right
bind=SUPER+Alt,h,tagmon,left
bind=SUPER+Alt,l,tagmon,right

# gaps
# bind=ALT+SHIFT,X,incgaps,1
# bind=ALT+SHIFT,Z,incgaps,-1
# bind=ALT+SHIFT,R,togglegaps

# movewin
# bind=CTRL+SHIFT,Up,movewin,+0,-50
# bind=CTRL+SHIFT,Down,movewin,+0,+50
# bind=CTRL+SHIFT,Left,movewin,-50,+0
# bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client


# layer rule
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi

# window rule
window_rule=force_tearing:1,vrr_only_fullscreen:1,title:Geometry Dash
window_rule=is_floating:1,is_open_silent:1,is_overlay:1,no_animation:1,width:426,height:240,title:Picture in picture
